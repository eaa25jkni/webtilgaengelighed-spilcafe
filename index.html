<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spiloversigt | Spilcaféen</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.png">

    

    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <header>

      <!--logo-->
      <a href="index.html" aria-label="Gå til forside" class="logo">
        <img
          src="images/logo.png"
          alt="Spilcafelogo"
          
        />
      </a>

      <!--main navigation-->
      <nav class="main-nav" id="main-navigation" aria-label="Hovedmenu">
        <ul class="nav-list">
          <li><a href="">Forside</a></li>
          <li><a href="/index.html" aria-current="page">Spiloversigt</a></li>
          <li><a href="">Om SpilCaféen</a></li>
        </ul>
      </nav>


      <div class="header-right">

        <!--favorit-->
        <a href="/favoritside.html" class="favoritelist-link" aria-label="Gå til din favoritliste">
          <img src="/images/hjerte.svg" alt="">
        </a>


        <!--book bord-->
        <a href="" class="book-bord">
          Book bord
        </a>

        <button class="burgermenu" type="button" aria-label="Åbn menu" aria-controls="main-navigation" aria-expanded="false"> <!--Vi sætter aria-expanded="false", så skærmlæsere kan fortælle om den er åben eller lukekt.-->
          <img src="images/burgermenu.svg" alt="">
        </button>

      </div>
      



      </div> 

      <!-- Filter dropdown panel -->
      <form class="filter-panel" id="filter-panel">
        <div class="filter-panel-content">
          <h2>Filtrer spil</h2>

          <div class="filter-row">
            <label for="header-sort-select">Sorter efter</label>
            <select id="header-sort-select">
              <option value="all">Ingen sortering</option>
              <option value="title">Titel (A-Å)</option>
              <option value="title2">Titel (Å-A)</option>
              <option value="rating">Mest populære</option>
            </select>
          </div>

          <div class="filter-row">
            <label for="header-genre-select">Kategori</label>
            <select id="header-genre-select">
              <option value="none">Alle kategorier</option>
            </select>
          </div>

          <div class="filter-row">
            <label for="header-players-from">Antal spillere</label>
            <div class="range-inputs">
              <input
                type="number"
                id="header-players-from"
                placeholder="Fra"
                min="1"
                max="8"
                step="1"
              />
            </div>
          </div>

          <div class="filter-row">
            <label for="header-playtime-select">Spilletid:</label>
           

              <select id="header-playtime-select">
              <option value="all">Alle spilletider</option>
              <option value="0-30">Under 30 minutter</option>
              <option value="30-60">30-60 minutter</option>
              <option value="60-120">60-120 minutter</option>
              <option value="120-999">Mere end 2 timer</option>
            </select>
              

              
            
          </div>

          <div class="filter-row">
            <label for="header-difficulty-select">Sværhedsgrad</label>
            <select id="header-difficulty-select">
              <option value="none">Alle sværhedsgrader</option>
              <option value="Let">Let</option>
              <option value="Mellem">Mellem</option>
              <option value="Svær">Svær</option>
            </select>
          </div>

          <div class="filter-row">
            <label for="header-age-from">Min. Alder</label>
            <div class="range-inputs">
              <input
                type="number"
                id="header-age-from"
                placeholder="Fra"
                min="0"
                max="100"
                step="1"
              />
            </div>
          </div>

          <!-- Location filter i midten -->
      <div class="header-location">
        <label for="location-select" aria-label="Vælg lokation"></label>
        <select id="location-select" class="location-dropdown">
          <option value="all">Alle lokationer</option>
        </select>
      </div> 

          <!-- <div class="filter-row">
            <label>Rating:</label>
            <div class="range-inputs">
              <input
                type="number"
                id="header-rating-from"
                placeholder="Fra"
                min="0"
                max="5"
                step="1"
              />
              <span>til</span>
              <input
                type="number"
                id="header-rating-to"
                placeholder="Til"
                min="0"
                max="5"
                step="1"
              />
            </div> -->
          </div>

          <div class="filter-actions">
            <button id="header-clear-filters" class="clear-btn">
              Ryd alle filtre
            </button>
            <button id="filter-close" class="close-btn">Vis resultater</button>
          </div>
        </div>
      </form>
    </header> 

    <main>
      <!-- <section>
        <h1>Mest populære</h1>
      </section> -->

      <!-- Game karrussel -->
      <!--  <div class="carousel-container">
        <section id="game-carousel"></section>
      </div> -->

      <section id="hero-spiloversigt">
        <h1>Spiloversigt</h1>
        <p>Gå på opdagelse i spilhylderne - Søg direkte efter dine personlige favoritter, eller filtrér på spillerantal, varighed og café for at opdage dit næste eventyr</p>

      </section>

      <section class="filter-sektion">
        <search class="header-search">
          <label for="header-search-input" class="gem">Søg spil efter titel</label>
          <input
            type="search"
            id="header-search-input"
            placeholder="Søg spil... (fx. Skak, Uno)"
          />
        </search>

        <p id="search-results" class="gem" aria-live="polite"></p>

        
        <button
          type="button"
          id="filter-toggle"
          class="filter-toggle"
          aria-label="Åbn filtre"
        >
          <img src="images/filtrerings-ikon.png" alt="" class="filter-icon" />
          <span id="filter-badge" class="filter-badge" style="display: none"
            >0</span
          >
        </button>

        
      </section>

      <section>
        <div class="games-header">
          <h2 id="games-title">Alle spil</h2>
          <div class="sort-controls">
            <label for="main-sort-select">Sortere efter</label>
            <select id="main-sort-select">
              <option value="all">Ingen sortering</option>
              <option value="title">Titel (A-Å)</option>
              <option value="title2">Titel (Å-A)</option>
              <option value="rating">Mest populære</option>
            </select>
          </div>
        </div>
      </section> 

      <!-- Aktiv filtrerings display -->
       <section
        class="active-filters-section"
        id="active-filters-section"
        style="display: none"
      >
        <div class="active-filters-container">
          <div class="active-filters-list" id="active-filters-list">
          </div>
        </div>
      </section> 

      <!-- Game List -->
      <section id="game-list"></section>
    </main>

    <!-- Game Modal -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Close">✕</button>
        <div id="dialog-content">
          <!-- Game details will be injected here via JavaScript -->
        </div>
      </form>
    </dialog>

    <footer>
      <nav>
        <ul>
          <li><p>Kontakt</p></li>
          <li></li>
          <li></li>
          <li></li>
        </ul>
      </nav>
    </footer>

  </body>
</html>
