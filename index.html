<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spiloversigt | Spilcaféen</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.png">

    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <header>

      <!--logo-->
      <a href="index.html" aria-label="Gå til forside" class="logo">
        <img
          src="images/logo.png"
          alt="Spilcafe logo"
          
        />
      </a>

      <!--main navigation-->
      <nav class="main-nav" id="main-navigation" aria-label="Hovedmenu">
        <ul class="nav-list">
          <li><a href="#">Forside</a></li>
          <li><a href="/index.html" aria-current="page">Spiloversigt</a></li>
          <li><a href="#">Om SpilCaféen</a></li>
        </ul>
      </nav>


      <!--header right side container-->
      <div class="header-right">

        <!--favorit-->
        <a href="/favoritside.html" class="favoritelist-link" aria-label="Gå til din favoritliste">
          <img src="/images/hjerte.svg" alt=""> <!--tom alt, fordi vi har et aria-label, så der ik kommer gentagelse-->
        </a>


        <!--book bord-->
        <a href="#" class="book-bord">
          Book bord
        </a>

        <!--burgermenu-->
        <button class="burgermenu" type="button" aria-label="Åbn burgermenu" aria-controls="main-navigation" aria-expanded="false"> <!--Vi sætter aria-expanded="false", så skærmlæsere kan fortælle om den er åben eller lukekt.-->
          <img src="images/burgermenu.svg" alt=""> <!--tom alt, fordi vi har et aria-label, så der ik kommer gentagelse-->
        </button>

      </div>
      
    </header> 

    <main>
      
      <section id="hero-spiloversigt">
        <h1>Spiloversigt</h1>
        <p>Gå på opdagelse i spilhylderne - Søg direkte efter dine personlige favoritter, eller filtrér på genre, spilletid og café for at opdage dit næste eventyr.</p>

      </section>

      <section class="filter-sektion">

        <!--Søgefelt-->
        <search class="header-search">
          <label for="header-search-input">Søg spil efter titel</label>
          <input
            type="search"
            id="header-search-input"
            placeholder="Søg spil... (fx. Skak, Uno)"
          />
        </search>

        <!--Filter knap-->
        <button
          type="button"
          id="filter-toggle"
          class="filter-toggle"
          aria-label="Åbn filtre">

          <img src="images/filtrerings-ikon.png" alt="" class="filter-icon" />
          <span id="filter-badge" class="filter-badge" style="display: none"
            >0</span>
        </button>


        <!-- Filter dropdown panel -->
      <form class="filter-panel" id="filter-panel">

        <div class="filter-panel-content">
          <button type="button" id="filter-panel-close" class="filter-panel-close" aria-label="Luk filter"><span>&#10005;</span></button>
          <h2>Filtrer spil</h2>

          <!-- Sorter efter -->
          <div class="filter-row">
            <label for="header-sort-select">Sorter efter:</label>
            <select id="header-sort-select">
              <option value="all">Ingen sortering</option>
              <option value="title">Titel (A-Å)</option>
              <option value="title2">Titel (Å-A)</option>
              <option value="rating">Mest populære</option>
            </select>
          </div>

          <!-- Genre -->
          <div class="filter-row">
            <label for="header-genre-select">Genre:</label>
            <select id="header-genre-select">
              <option value="none">Alle genre</option>
            </select>
          </div>

          <!-- Antal spillere -->
          <div class="filter-row">
            <label for="header-players-from">Antal spillere (minium):</label>

              <input
                type="number"
                id="header-players-from"
                class="range-inputs"
                placeholder="Fx. 2"
                min="1"
                max="8"
                step="1"
              />
          </div>
          

          <!-- Spilletid -->
          <div class="filter-row">
            <label for="header-playtime-select">Spilletid:</label>
            <select id="header-playtime-select">
              <option value="all">Alle spilletider</option>
              <option value="0-30">Under 30 minutter</option>
              <option value="30-60">30-60 minutter</option>
              <option value="60-120">60-120 minutter</option>
              <option value="120-999">Mere end 2 timer</option>
            </select>
          </div>

          <!-- Sværhedsgrad -->
          <div class="filter-row">
            <label for="header-difficulty-select">Sværhedsgrad:</label>
            <select id="header-difficulty-select">
              <option value="none">Alle sværhedsgrader</option>
              <option value="Let">Let</option>
              <option value="Mellem">Mellem</option>
              <option value="Svær">Svær</option>
            </select>
          </div>

          <!-- Alder -->
          <div class="filter-row">
            <label for="header-age-from">Aldersgrænse (minium):</label>
            
              <input
                type="number"
                id="header-age-from"
                class="range-inputs"
                placeholder="Fx. 18"
                min="0"
                max="100"
                step="1"
              />
            
          </div>

          <!-- Location -->
          <div class="filter-row">
            <label for="location-select">Lokation:</label>
            <select id="location-select" class="location-dropdown">
              <option value="all">Alle lokationer</option>
            </select>
          </div> 


          <!-- Knapper ryd og vis -->
          <div class="filter-actions">
            <button type="reset" id="header-clear-filters" class="clear-btn">
              Ryd alle filtre
            </button>
            <button type="button" id="filter-close" class="close-btn">Vis resultater</button>
          </div>
          
        </div>
      </form>

      </section>



      <section>
        <div class="games-header">
          <h2 id="games-title">Alle spil</h2>
          <div class="sort-controls">
            <label for="main-sort-select">Sorter efter</label>
            <select id="main-sort-select">
              <option value="all">Ingen sortering</option>
              <option value="title">Titel (A-Å)</option>
              <option value="title2">Titel (Å-A)</option>
              <option value="rating">Mest populære</option>
            </select>
          </div>
        </div>
      </section> 

      <!-- Aktiv filtrerings display -->
       <section
        class="active-filters-section"
        id="active-filters-section"
        style="display: none"
        aria-labelledby="active-filters-heading"> <!--så er sektionen tilkoblet en h2'er, og dermed kan skærmlæsebruger forstå hvilke sektion vi er i-->

        <h2 id="active-filters-heading" class="gem">Aktive filtreringer</h2>

        <div class="active-filters-container">
          <div class="active-filters-list" id="active-filters-list">
          </div>
        </div>
      </section> 

      <!-- Game List -->
      <section id="game-list"></section>
      
    </main>

    <!-- Game Modal -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Close">✕</button>
        <div id="dialog-content">
          <!-- Game details will be injected here via JavaScript -->
        </div>
      </form>
    </dialog>

    <footer>
      <nav>
        <ul>
          <li>1</li>
          <li>2</li>
          <li>3</li>
          <li>3</li>
        </ul>
      </nav>
    </footer>

    

    <script src="js/oversigt.js"></script>

  </body>
</html>
