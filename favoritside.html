<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mine Favoritter | Spilcaféen</title>
    <link rel="icon" type="image/x-icon" href="../images/logo.png">

    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <!-- Header -->
    <header>

      <!--logo-->
      <a href="index.html" aria-label="Gå til forside" class="logo">
        <img
          src="images/logo.png"
          alt="Spilcafelogo"
          
        />
      </a>

      <!--main navigation-->
      <nav class="main-nav" id="main-navigation" aria-label="Hovedmenu">
        <ul class="nav-list">
          <li><a href="#">Forside</a></li>
          <li><a href="/index.html" >Spiloversigt</a></li>
          <li><a href="#">Om SpilCaféen</a></li>
        </ul>
      </nav>


      <div class="header-right">

        <!--favorit-->
        <a href="/favoritside.html" aria-current="page" class="favoritelist-link" aria-label="Gå til din favoritliste">
          <img src="/images/hjerte.svg" alt="">
        </a>


        <!--book bord-->
        <a href="#" class="book-bord">
          Book bord
        </a>

        <button class="burgermenu" type="button" aria-label="Åbn menu" aria-controls="main-navigation" aria-expanded="false"> <!--Vi sætter aria-expanded="false", så skærmlæsere kan fortælle om den er åben eller lukekt.-->
          <img src="images/burgermenu.svg" alt="">
        </button>

      </div>
       

      
    </header> 

    <!-- Main content -->
    <main>

      <section id="hero-spiloversigt">
        <h1>Din favoritliste</h1>
        <p>Dine favoritter samlet et sted - Her finder du alle dine gemte favorit spil. </p>

      </section>

      <!-- Page header -->
      <section>
        <div class="games-header">
          <h2 id="favorites-count">Mine Favoritter</h2>
        </div>
      </section>

      

      <!-- Game list -->
      <section id="favorites-list" class="game-grid"></section>

    </main>

    <!-- Game Modal -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Close">✕</button>
        <div id="dialog-content">
          <!-- Game details will be injected here via JavaScript -->
        </div>
      </form>
    </dialog>

    <footer>
        <a href="index.html" aria-label="Gå til forside" class="logo-footer">
          <img
            src="images/logo.png"
            alt="Spilcafe logo"
          />
        </a>

        <p>© Spilcaféen (Eksamensprojekt)</p>
      
     
    </footer>
    

    <script src="js/favoritside.js"></script>
  </body>
</html>
